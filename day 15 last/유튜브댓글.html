<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 댓글 구현</title>
    <style>
        .comment_container {
            display: flex;
            justify-content: space-between;
            margin: 16px;
            max-width: 1200px;
        }

        figure {
            background: url(./다운로드.png);
            width: 40px;
            height: 40px;
            margin: 0;
            background-size: contain;
            background-repeat: no-repeat;
        }

        figure > a {
            width: 40px;
            height: 40px;
            display: block;
        }

        .user_comment {
            flex-basis: 95%;
        }
        .username
        .comment_content {
            font-size: 14px;
        }

        .iconbox {
            display: flex;
            align-items: center;
        }

        .iconbox > div {
            margin-right: 20px;
        }

        .recomment {
            color: #065fd4;
            width: 100px;
            height: 70px;
            text-align: left;
            line-height: 70px;
            cursor: pointer;
        }

        /* section {
            width: 100%;
            display: flex;
        }

        .text_area {
            margin: 10px;
            padding: 10px;
        }

        .fa-solid fa-user fa-2x {
            left: 50px;
        } */
    </style>
     <script src="https://kit.fontawesome.com/161085b17f.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="comment_container">
        <figure>
            <a href="#"></a>
        </figure>
        <div class="user_comment">
            <h2 class="username">
                @백종원
            </h2>
            <p class="comment_content">
                흑백요리사 보다가 밤을 새웟슈 <br>빠스 한번 더 만들어주슈
            </p>
            <div class="iconbox">
                <div>
                    <i class="fa-regular fa-thumbs-up"></i>
                    <span>500</span>
                </div>
                <div>
                    <i class="fa-solid fa-thumbs-down"></i>
                </div>
                <p>reply</p>
                <div class="recomment">
                    <i class="fa-light fa-chevron-down"></i>
                    <span>1 reply</span>
                </div>
                
            </div>
        </div>
        <div></div>
    </div>

</html>
