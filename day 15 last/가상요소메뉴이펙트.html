<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상요소메뉴이펙트</title>
    <style>
        body {
            background: gold;
        }
        .menu_hover_effect > ul {
            display: flex;
        }

        .menu_hover_effect > ul > li {
            list-style: none;
            margin: 16px;
        }
        .menu_hover_effect > ul > li  > a {
            text-decoration: none;
            color: white;
            font-size: 24px;
            padding: 10px 20px;
            position: relative;
        }

        .menu_hover_effect a::before {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: #fff;
            transition: 0.3s;
        }

        .menu_hover_effect a::after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 0;
            background: #fff;
            transition: 0.3s;
        }

        .menu_hover_effect a :hover::before {
            top: 100%;
        }
        
        .menu_hover_effect a :hover::after {
            height: 100%;
        }
    </style>
</head>
<body>
    <nav class="menu_hover_effect">
        <ul>
            <li>
                <a href="#">html</a>
            </li>
            <li>
                <a href="#">css</a>
            </li>
            <li>
                <a href="#">uxui design</a>
            </li>
            <li>
                <a href="#">javascript</a>
            </li>
            <li>
                <a href="#">react</a>
            </li>
        </ul>
    </nav>
</body>
</html>
